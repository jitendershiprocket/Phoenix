<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phoenix Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a2235;
      --bg-card: #212d45;
      --surface: #2a3855;
      --border: #3d4d6e;
      --text: #e8edf7;
      --text-muted: #8b9dc3;
      --accent: #00d4ff;
      --accent2: #7c5cff;
      --accent3: #00f5d4;
      --success: #00f5a0;
      --fail: #ff6b6b;
      --fail-dim: rgba(255, 107, 107, 0.2);
      --fail-border: rgba(255, 107, 107, 0.5);
      --pending: #5a6b8a;
      --running: #00d4ff;
      --glow: rgba(0, 212, 255, 0.4);
      --glow-soft: rgba(124, 92, 255, 0.3);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(0, 212, 255, 0.18), transparent 50%),
        radial-gradient(ellipse 60% 40% at 100% 50%, rgba(124, 92, 255, 0.12), transparent 50%),
        radial-gradient(ellipse 50% 30% at 0% 80%, rgba(0, 245, 212, 0.1), transparent 50%);
      animation: bgShift 15s ease-in-out infinite alternate;
    }
    @keyframes bgShift {
      0% { background-position: 0% 0%, 100% 50%, 0% 80%; }
      100% { background-position: 100% 0%, 0% 50%, 100% 80%; }
    }
    .container { max-width: 780px; margin: 0 auto; padding: 2rem 1.5rem; position: relative; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo-wrap { display: flex; align-items: center; gap: 0.75rem; }
    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
    }
    .subtitle { font-size: 0.8125rem; color: var(--text-muted); font-weight: 500; }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      background: rgba(0, 212, 255, 0.12);
      border: 1px solid rgba(0, 212, 255, 0.35);
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      animation: livePulse 2s ease-in-out infinite;
    }
    .live-pill.hidden { display: none; }
    .live-dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes livePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 212, 255, 0.3); }
      50% { box-shadow: 0 0 12px 2px rgba(0, 212, 255, 0.2); }
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .agent-mascot {
      flex-shrink: 0;
      width: 200px;
      height: 200px;
      filter: drop-shadow(0 8px 24px rgba(0, 212, 255, 0.25));
      transition: transform 0.3s ease;
    }
    .agent-mascot:hover { transform: scale(1.03); }
    .agent-mascot.running .tool-arm {
      animation: fixSwing 1.2s ease-in-out infinite;
      transform-origin: 30px 5px;
    }
    .agent-mascot.running .eye-led, .agent-mascot.running .antenna-led {
      animation: ledBlink 0.8s ease-in-out infinite;
    }
    @keyframes ledBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .agent-mascot.running .spark { opacity: 1; animation: sparkle 0.8s ease-in-out infinite; }
    .agent-mascot .spark { opacity: 0; transition: opacity 0.3s; }
    @keyframes fixSwing {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(12deg); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .bug-card {
      background: linear-gradient(145deg, var(--surface) 0%, var(--bg-card) 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 2rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .bug-card:hover { transform: translateY(-1px); box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
    .bug-card h2 {
      margin: 0 0 1rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .bug-card .summary { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.75rem; word-break: break-word; color: var(--text); }
    .bug-card .error-highlight {
      background: var(--fail-dim);
      border-left: 4px solid var(--fail);
      padding: 0.75rem 1rem;
      border-radius: 0 10px 10px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8125rem;
      color: var(--fail);
      margin-bottom: 0.5rem;
    }
    .bug-card .meta { font-family: 'JetBrains Mono', monospace; font-size: 0.8125rem; color: var(--text-muted); }
    .bug-card a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .bug-card a:hover { text-decoration: underline; }
    .pipeline {
      margin-bottom: 2rem;
      display: flex;
      align-items: flex-start;
      gap: 1.5rem;
      flex-direction: row;
    }
    .pipeline-main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: stretch;
      gap: 1rem;
    }
    .timeline-vertical {
      flex-shrink: 0;
      width: 14px;
      min-height: 280px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
    }
    .timeline-vertical-fill {
      width: 100%;
      border-radius: 6px 6px 0 0;
      transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      background: linear-gradient(180deg, #00d4ff 0%, #7c5cff 50%, #00f5d4 100%);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.35);
      min-height: 4px;
      align-self: flex-start;
    }
    .timeline-vertical-fill.done {
      background: linear-gradient(180deg, #00d4ff, #00f5a0);
      box-shadow: 0 0 14px rgba(0, 245, 160, 0.4);
    }
    .pipeline-content { flex: 1; min-width: 0; }
    .pipeline-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem; }
    .pipeline h2 {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .timeline-pct {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .pipeline-inner { display: flex; flex-direction: column; gap: 1rem; }
    .step {
      display: flex;
      align-items: flex-start;
      gap: 1.25rem;
      padding: 1.25rem 1.5rem;
      background: linear-gradient(145deg, var(--surface) 0%, var(--bg-card) 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    .step::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--border);
      border-radius: 4px 0 0 4px;
    }
    .step.done::before { background: var(--success); }
    .step.running::before {
      background: linear-gradient(180deg, var(--accent), var(--accent3));
      animation: lineGlow 1.5s ease-in-out infinite;
    }
    .step.failed::before { background: var(--fail); }
    @keyframes lineGlow {
      0%, 100% { opacity: 1; box-shadow: 0 0 10px var(--glow); }
      50% { opacity: 0.85; box-shadow: 0 0 20px var(--glow); }
    }
    .step:hover { transform: translateX(4px); border-color: rgba(0, 212, 255, 0.2); }
    .step.running {
      transform: scale(1.02) translateX(4px);
      border-color: rgba(0, 212, 255, 0.5);
      box-shadow:
        0 0 0 1px rgba(0, 212, 255, 0.2),
        0 0 40px rgba(0, 212, 255, 0.15),
        inset 0 1px 0 rgba(255,255,255,0.03);
      animation: cardGlow 2s ease-in-out infinite;
    }
    .step.running:hover { transform: scale(1.02) translateX(6px); }
    @keyframes cardGlow {
      0%, 100% { box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.2), 0 0 40px rgba(0, 212, 255, 0.15), inset 0 1px 0 rgba(255,255,255,0.03); }
      50% { box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.35), 0 0 50px rgba(0, 212, 255, 0.25), inset 0 1px 0 rgba(255,255,255,0.05); }
    }
    .step.failed {
      background: linear-gradient(145deg, var(--fail-dim) 0%, rgba(255,107,107,0.06) 100%);
      border-color: rgba(255, 107, 107, 0.4);
    }
    .step.failed .step-msg { color: var(--fail); font-weight: 500; }
    .step-icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      transition: all 0.3s ease;
    }
    .step-icon.pending {
      background: rgba(90, 107, 138, 0.2);
      border: 1px solid var(--border);
      color: var(--pending);
    }
    .step-icon.running {
      width: 56px;
      height: 56px;
      font-size: 1.5rem;
      background: linear-gradient(145deg, rgba(0, 212, 255, 0.2) 0%, rgba(124, 92, 255, 0.15) 100%);
      border: 2px solid rgba(0, 212, 255, 0.5);
      color: var(--accent);
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
      position: relative;
    }
    .step-icon.running .progress-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(0, 212, 255, 0.25);
    }
    .step-icon.running .progress-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent2);
      animation: spin 0.8s linear infinite;
    }
    .step-icon.running .progress-ring::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-bottom-color: var(--accent3);
      border-left-color: var(--accent);
      animation: spin 1.1s linear infinite reverse;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .step-icon.running .progress-dots {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }
    .step-icon.running .progress-dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotBounce 0.6s ease-in-out infinite;
    }
    .step-icon.running .progress-dots span:nth-child(1) { animation-delay: 0s; }
    .step-icon.running .progress-dots span:nth-child(2) { animation-delay: 0.15s; }
    .step-icon.running .progress-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dotBounce {
      0%, 100% { transform: scale(0.6); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    .step-icon.done {
      background: rgba(0, 245, 160, 0.15);
      border: 1px solid rgba(0, 245, 160, 0.4);
      color: var(--success);
    }
    .step-icon.failed {
      background: var(--fail-dim);
      border: 1px solid rgba(255, 107, 107, 0.5);
      color: var(--fail);
    }
    @keyframes iconPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .step-body { flex: 1; min-width: 0; }
    .step-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .step-label { font-weight: 600; font-size: 1rem; }
    .step-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      background: rgba(0, 212, 255, 0.1);
      color: var(--accent);
      min-width: 4.5em;
      text-align: center;
    }
    .step.running .step-time {
      background: rgba(0, 212, 255, 0.2);
      color: var(--accent);
      font-size: 1rem;
      padding: 0.45rem 0.9rem;
      animation: timePulse 1s ease-in-out infinite;
      border: 1px solid rgba(0, 212, 255, 0.3);
    }
    .step.failed .step-time { background: var(--fail-dim); color: var(--fail); }
    .step.pending .step-time { background: rgba(90, 107, 138, 0.15); color: var(--pending); }
    @keyframes timePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.75; } }
    .step-msg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-all;
      margin-top: 0.5rem;
    }
    .result {
      border-radius: 16px;
      padding: 2rem 1.75rem;
      text-align: center;
    }
    .result.done {
      background: linear-gradient(145deg, rgba(0, 245, 160, 0.15) 0%, rgba(0, 245, 160, 0.05) 100%);
      border: 2px solid rgba(0, 245, 160, 0.5);
      box-shadow: 0 0 30px rgba(0, 245, 160, 0.15);
    }
    .result.failed {
      background: linear-gradient(145deg, var(--fail-dim) 0%, rgba(255,107,107,0.05) 100%);
      border: 2px solid rgba(255, 107, 107, 0.5);
    }
    .result.hidden { display: none; }
    .result h2 { margin: 0 0 1rem; font-size: 1.25rem; font-weight: 700; }
    .result.done h2 { color: var(--success); }
    .result.failed h2 { color: var(--fail); }
    .pr-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.75rem;
      background: linear-gradient(135deg, #00f5a0 0%, #00d4ff 100%);
      color: #0c1222 !important;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      margin-top: 0.5rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 24px rgba(0, 245, 160, 0.35);
    }
    .pr-link:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 36px rgba(0, 245, 160, 0.45);
      text-decoration: none;
      color: #0c1222 !important;
    }
    .pr-link.highlight { animation: pr-pulse 1.5s ease-out; }
    @keyframes pr-pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 245, 160, 0.8); transform: scale(1.02); }
      50% { box-shadow: 0 0 24px 8px rgba(0, 245, 160, 0.4); transform: scale(1.03); }
      100% { box-shadow: 0 4px 24px rgba(0, 245, 160, 0.35); transform: scale(1); }
    }
    .last-log {
      margin-top: 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--fail);
      background: rgba(0,0,0,0.4);
      padding: 1rem;
      border-radius: 10px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--fail-border);
    }
    @media (max-width: 700px) {
      .pipeline { flex-direction: column; align-items: stretch; }
      .pipeline-main { flex-direction: column; }
      .timeline-vertical { min-height: 180px; }
      .agent-mascot { width: 160px; height: 160px; align-self: center; order: -1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-wrap">
        <div>
          <div class="logo">Shiprocket Phoenix</div>
          <div class="subtitle">AI self-healing agent</div>
        </div>
      </div>
      <div class="live-pill hidden" id="live-pill">
        <span class="live-dot"></span>
        Agent working...
      </div>
    </header>
    <div class="bug-card" id="bug-card">
      <h2>Issue from Sentry</h2>
      <div class="summary" id="bug-summary">—</div>
      <div class="error-highlight" id="bug-error" style="display:none;"></div>
      <div class="meta" id="bug-meta"></div>
    </div>
    <div class="pipeline">
      <div class="agent-mascot" id="agent-mascot" title="Phoenix Agent — fixing your bugs">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#00d4ff"/>
          <stop offset="100%" style="stop-color:#7c5cff"/>
        </linearGradient>
        <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#4a5568"/>
          <stop offset="50%" style="stop-color:#2d3748"/>
          <stop offset="100%" style="stop-color:#1a202c"/>
        </linearGradient>
        <linearGradient id="toolGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#00f5d4"/>
          <stop offset="100%" style="stop-color:#00d4ff"/>
        </linearGradient>
        <filter id="glow">
          <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <g transform="translate(100,95)">
        <ellipse cx="0" cy="55" rx="60" ry="18" fill="rgba(0,0,0,0.3)"/>
        <rect x="-38" y="-55" width="76" height="90" rx="6" fill="url(#bodyGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
        <rect x="-32" y="-48" width="8" height="8" rx="1" fill="url(#metalGrad)" stroke="rgba(255,255,255,0.2)"/>
        <rect x="-16" y="-48" width="8" height="8" rx="1" fill="url(#metalGrad)" stroke="rgba(255,255,255,0.2)"/>
        <rect x="0" y="-48" width="8" height="8" rx="1" fill="url(#metalGrad)" stroke="rgba(255,255,255,0.2)"/>
        <rect x="16" y="-48" width="8" height="8" rx="1" fill="url(#metalGrad)" stroke="rgba(255,255,255,0.2)"/>
        <rect x="32" y="-48" width="8" height="8" rx="1" fill="url(#metalGrad)" stroke="rgba(255,255,255,0.2)"/>
        <line x1="0" y1="-65" x2="0" y2="-85" stroke="url(#bodyGrad)" stroke-width="3"/>
        <circle cx="0" cy="-90" r="5" fill="#00d4ff" class="antenna-led"/>
        <rect x="-24" y="-42" width="12" height="12" rx="2" fill="#0c1222"/>
        <rect x="12" y="-42" width="12" height="12" rx="2" fill="#0c1222"/>
        <rect x="-22" y="-40" width="6" height="6" rx="1" fill="#00f5a0" class="eye-led"/>
        <rect x="14" y="-40" width="6" height="6" rx="1" fill="#00f5a0" class="eye-led"/>
        <rect x="-22" y="-18" width="44" height="18" rx="3" fill="url(#metalGrad)" stroke="rgba(255,255,255,0.15)"/>
        <rect x="-18" y="-14" width="36" height="10" rx="2" fill="#0c1222"/>
        <rect x="-14" y="-10" width="6" height="6" fill="#00d4ff" opacity="0.8"/>
        <rect x="-4" y="-10" width="6" height="6" fill="#7c5cff" opacity="0.8"/>
        <rect x="6" y="-10" width="6" height="6" fill="#00f5d4" opacity="0.8"/>
        <g class="tool-arm" transform="rotate(-12)">
          <rect x="28" y="-6" width="8" height="55" rx="2" fill="url(#metalGrad)" stroke="rgba(255,255,255,0.3)"/>
          <rect x="24" y="-55" width="16" height="22" rx="2" fill="url(#toolGrad)" stroke="rgba(255,255,255,0.5)"/>
        </g>
        <circle class="spark" cx="36" cy="-45" r="4" fill="#fff" filter="url(#glow)"/>
      </g>
    </svg>
      </div>
      <div class="pipeline-main">
      <div class="timeline-vertical">
        <div class="timeline-vertical-fill" id="timeline-bar" style="height: 0%"></div>
      </div>
      <div class="pipeline-content">
      <div class="pipeline-header">
        <h2>Pipeline <span class="timeline-pct" id="timeline-pct">0%</span></h2>
      </div>
      <div class="pipeline-inner">
        <div id="steps"></div>
      </div>
      </div>
      </div>
    </div>
    <div class="result hidden" id="result">
      <h2 id="result-title">—</h2>
      <a class="pr-link" id="pr-link" href="#" target="_blank" rel="noopener" style="display:none;">Open Pull Request ↗</a>
      <div class="last-log" id="result-log"></div>
    </div>
  </div>
  <script>
    let lastGoodData = null;
    let lastStepsKey = '';
    let lastPrUrl = '';
    const stepLabels = {
      fetch: 'Fetch bug from Sentry',
      clone: 'Clone repo & create fix branch',
      fix: 'AI fix + apply edits',
      validate: 'ng build & lint',
      pr: 'Create PR'
    };
    const stepIcons = {
      fetch: '⬇',
      clone: '⎘',
      fix: '⚡',
      validate: '✔',
      pr: '#'
    };
    function render(data) {
      if (!data) return;
      lastGoodData = data;
      const steps = data.steps || [];
      const hasRunning = steps.some(s => (s.status || '') === 'running');
      const isDone = data.overall_status === 'done' || data.overall_status === 'failed';
      const livePill = document.getElementById('live-pill');
      livePill.classList.toggle('hidden', isDone || !hasRunning);
      document.getElementById('agent-mascot').classList.toggle('running', hasRunning);
      document.getElementById('bug-summary').textContent = data.bug_summary || '—';
      const details = data.bug_details || {};
      const errEl = document.getElementById('bug-error');
      if (details.error) {
        errEl.textContent = details.error;
        errEl.style.display = 'block';
      } else errEl.style.display = 'none';
      const meta = [details.culprit, details.file].filter(Boolean).join(' • ');
      document.getElementById('bug-meta').textContent = meta || '';
      if (details.link) {
        const el = document.getElementById('bug-meta');
        el.innerHTML = (meta ? meta + ' · ' : '') + '<a href="' + details.link + '" target="_blank" rel="noopener">View in Sentry →</a>';
      }
      const stepsKey = steps.map(s => [s.name, s.status, s.duration_sec, s.status === 'running' ? Math.floor(s.elapsed_sec || 0) : null, (s.message||'').slice(0,80)]).join('|');
      let doneCount = 0;
      const total = steps.length;
      let html = '';
      steps.forEach((s) => {
        const iconClass = s.status || 'pending';
        if (iconClass === 'done') doneCount++;
        let icon = stepIcons[s.name] || '○';
        if (iconClass === 'done') icon = '✓';
        else if (iconClass === 'failed') icon = '✕';
        const label = stepLabels[s.name] || s.label || s.name;
        let msg = (s.message || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        let dur = '—';
        if (s.duration_sec != null) dur = s.duration_sec.toFixed(1) + 's';
        else if (s.elapsed_sec != null && iconClass === 'running') dur = s.elapsed_sec.toFixed(1) + 's';
        const isFailed = iconClass === 'failed';
        const runningIcon = iconClass === 'running'
          ? '<span class="progress-ring"></span><span class="progress-dots"><span></span><span></span><span></span></span>'
          : icon;
        html += `<div class="step ${iconClass} ${isFailed ? 'failed' : ''}">
          <div class="step-icon ${iconClass}">${runningIcon}</div>
          <div class="step-body">
            <div class="step-top">
              <div class="step-label">${label}</div>
              <div class="step-time">${dur}</div>
            </div>
            ${msg ? '<div class="step-msg">' + msg + '</div>' : ''}
          </div>
        </div>`;
      });
      if (stepsKey !== lastStepsKey) {
        lastStepsKey = stepsKey;
        document.getElementById('steps').innerHTML = html || '<div class="step pending"><div class="step-icon pending">○</div><div class="step-body"><div class="step-top"><div class="step-label">Loading…</div><div class="step-time">—</div></div></div></div>';
      }
      const bar = document.getElementById('timeline-bar');
      const pct = total ? Math.round((doneCount / total) * 100) : 0;
      bar.style.height = pct + '%';
      bar.classList.toggle('done', data.overall_status === 'done');
      document.getElementById('timeline-pct').textContent = pct + '%';
      const result = document.getElementById('result');
      const status = data.overall_status;
      if (status === 'done' || status === 'failed') {
        result.classList.remove('hidden');
        result.classList.toggle('done', status === 'done');
        result.classList.toggle('failed', status === 'failed');
        document.getElementById('result-title').textContent = status === 'done' ? '✓ Success — PR Created' : '✕ Failed';
        const prUrl = (data.pr_url || '').trim();
        const prLink = document.getElementById('pr-link');
        if (prUrl) {
          prLink.href = prUrl;
          prLink.style.display = 'inline-flex';
          if (lastPrUrl !== prUrl) {
            lastPrUrl = prUrl;
            prLink.classList.add('highlight');
            result.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        } else { prLink.style.display = 'none'; lastPrUrl = ''; }
        const logEl = document.getElementById('result-log');
        logEl.textContent = data.last_log || '';
        logEl.style.display = data.last_log ? 'block' : 'none';
      } else result.classList.add('hidden');
    }
    function poll() {
      fetch('/api/status').then(r => r.json()).then(render).catch(() => {
        if (lastGoodData) render(lastGoodData);
      });
    }
    poll();
    setInterval(poll, 500);
  </script>
</body>
</html>
