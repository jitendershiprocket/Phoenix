# Project Phoenix - Sentry → Repo Mapping
# REQUIRED for --from-sentry: SENTRY_PROJECT (in .env) must match a repo "name" below.
# Phoenix uses ONLY this mapping — no hardcoded project references.
# Add your prod Sentry project + GitHub repo here.

repos:
  - name: demo-app
    url: https://github.com/jitendershiprocket/demo-app
    default_branch: main

