# Project Phoenix - Sentry → Repo Mapping
# REQUIRED for --from-sentry: SENTRY_PROJECT (in .env) must match a repo "name" below.
# Phoenix uses ONLY this mapping — no hardcoded project references.
# Add your prod Sentry project + GitHub repo here.

repos:
  - name: demo-app
    url: https://github.com/jitendershiprocket/demo-app
    default_branch: main

  - name: seller_19   # SR_Web - Sentry project 4510981177081856
    url: https://github.com/jitendershiprocket/SR_Web
    default_branch: agent_ai
    node_version: "20"
    angular_version: "19"
    npm_install_args: ["--force"]
    search_scope: ["src/app"]
    skip_lint: true

  # Add prod mapping, e.g.:
