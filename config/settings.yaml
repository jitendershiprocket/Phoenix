# Project Phoenix - Global Settings (no project-specific values)
# Repo mapping: config/repos.yaml. Env: .env (SENTRY_ORG, SENTRY_PROJECT, GITHUB_TOKEN)

brain:
  model: claude-opus-4-6
  max_tokens: 4096
  temperature: 0.2  # Low for deterministic fixes

orchestrator:
  max_fix_attempts: 3
  retry_on_validation_fail: true

validation:
  use_docker: false  # POC: use local ng test. Set true for sandbox.
  docker_image: node:20  # For ng test/lint
  node_version: "20"  # nvm use 20 before ng test/lint
  npm_install_args: ["--force"]  # Resolve peer-dep conflicts (e.g. Angular 19)
  lint_changed_only: true  # Lint only the fixed file; false = full project (production may not have lint)
  eslint_timeout: 0    # 0 = no timeout (large projects may take 2-4 min)
  build_timeout: 480   # npm install + npm run build timeout (sec). 480 = 8 min for large Angular apps

paths:
  work_dir: ./workspace  # Cloned repos land here
  cache_repos: true     # Reuse clone if branch exists

# Sentry: org + project from .env. Repo URL from repos.yaml (name must match SENTRY_PROJECT)
